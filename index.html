<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17121d"><title>Sana Özel Menü ♡</title><style>
:root{color-scheme:dark;--line:#352b3b;--muted:#c4b9cb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top,#30203a 0,#100e13 52%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(920px,100% - 28px);margin:auto;padding:24px 0 130px}.hero{text-align:center;padding:35px 18px 30px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,#211828,#17131d);box-shadow:0 16px 50px #0004}.kicker{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#e7a7ec;font-weight:800}.hero h1{font-size:clamp(34px,8vw,58px);line-height:1.05;letter-spacing:-1.8px;margin:12px 0}.hero p{color:var(--muted);margin:0}nav{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;position:sticky;top:0;background:#100e13e8;backdrop-filter:blur(12px);z-index:2}nav a{flex-shrink:0;text-decoration:none;color:white;border:1px solid var(--line);background:#211b27;border-radius:99px;padding:10px 14px;font-size:14px}section{padding-top:25px;scroll-margin-top:75px}.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}.head h2{margin:0;font-size:24px}.head span{color:var(--muted);font-size:13px}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}.item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);background:linear-gradient(135deg,#201a25,#18141c);border-radius:17px;min-width:0}.emoji{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;border-radius:13px;background:#322339;font-size:23px}.name{font-weight:750;line-height:1.25;flex:1}.pick{border:1px solid #584360;background:#2b2131;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;white-space:nowrap}.pick.on{background:linear-gradient(100deg,#a64ddd,#e45fae);border-color:transparent}.qty{display:none;align-items:center;gap:7px;margin-top:8px}.qty.show{display:flex}.qty button{width:27px;height:27px;border:1px solid #5a4963;background:#211a27;color:white;border-radius:8px;font-size:17px}.qty b{min-width:18px;text-align:center;font-size:14px}.dock{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#151119ed;border-top:1px solid var(--line);backdrop-filter:blur(14px)}.dock-inner{max-width:920px;margin:auto;display:flex;align-items:center;gap:12px;justify-content:space-between}.summary{font-size:13px;color:#e2d9e7}.summary strong{display:block;color:#fff;font-size:15px;margin-bottom:2px}.send{border:0;border-radius:14px;padding:13px 15px;background:linear-gradient(100deg,#a64ddd,#e45fae);color:white;font-weight:900;cursor:pointer;white-space:nowrap}footer{text-align:center;color:#8f8296;font-size:12px;margin:28px 0}@media(max-width:480px){.wrap{width:calc(100% - 20px);padding-top:10px}.hero{padding:28px 14px}.item{padding:11px}.send{padding:12px 11px;font-size:13px}.summary{font-size:12px}}
</style></head><body><main class="wrap"><header class="hero"><div class="kicker">Biraz mutluluk seç</div><h1>Sana Özel Menü <span style="color:#f39cda">♡</span></h1><p>Canın ne çekiyorsa seç bakalım ✨</p></header><nav aria-label="Menü kategorileri"><a href="#cikolata">🍫 Çikolata</a><a href="#icecek">🥤 İçecek</a><a href="#sakiz">🍬 Sakız</a><a href="#tatli">🍰 Tatlı</a></nav><div id="menu"></div><footer>Fiyat yok, sadece favori lezzetler ♡</footer></main><div class="dock"><div class="dock-inner"><div class="summary" id="summary"><strong>Seçtiklerin</strong>Henüz ürün seçilmedi</div><button class="send" onclick="sendSelection()">Seçtiklerimi Gönder ↗</button></div></div>
<script>
// Yayınlamadan önce bu numarayı kendi numaranla değiştir. Ülke kodu dahil; + ve boşluk kullanma.
const WHATSAPP_NUMBER = "NUMARANI_BURAYA_YAZ";
const groups=[{id:"cikolata",title:"🍫 Çikolata",emoji:"🍫",items:["Eti Browni","Ülker Laviva","Ülker Dido","Milka","Kinder Pinguin","Züber Protein Bar"]},{id:"icecek",title:"🥤 İçecek",emoji:"🥤",items:["Fuse Tea Mango","Red Bull","Freşa Meyveli Gazoz","Monster Enerji İçeceği"]},{id:"sakiz",title:"🍬 Sakız",emoji:"🍬",items:["Vivident","First","Oneo"]},{id:"tatli",title:"🍰 Tatlı",emoji:"🍰",items:["Ekler","Soğuk Baklava"]}];const chosen={};const menu=document.getElementById("menu");groups.forEach((g,gi)=>{const s=document.createElement("section");s.id=g.id;s.innerHTML=`<div class="head"><h2>${g.title}</h2><span>${g.items.length} ürün</span></div><div class="items"></div>`;const items=s.querySelector('.items');g.items.forEach((name,i)=>{const id=`${gi}-${i}`,c=document.createElement('article');c.className='item';c.innerHTML=`<div class="emoji">${g.emoji}</div><div class="name">${name}<div class="qty" id="qty-${id}"><button aria-label="Azalt">−</button><b id="num-${id}">1</b><button aria-label="Artır">+</button></div></div><button class="pick" id="pick-${id}">Seç</button>`;const b=c.querySelector('.pick');b.onclick=()=>{if(chosen[id])delete chosen[id];else chosen[id]={name,qty:1};const on=!!chosen[id];b.classList.toggle('on',on);b.textContent=on?'Seçildi ✓':'Seç';c.querySelector('.qty').classList.toggle('show',on);updateSummary()};const [minus,plus]=c.querySelectorAll('.qty button');minus.onclick=()=>setQty(id,-1);plus.onclick=()=>setQty(id,1);items.appendChild(c)});menu.appendChild(s)});function setQty(id,d){if(!chosen[id])return;chosen[id].qty=Math.max(1,chosen[id].qty+d);document.getElementById('num-'+id).textContent=chosen[id].qty;updateSummary()}function updateSummary(){const a=Object.values(chosen),n=a.reduce((t,p)=>t+p.qty,0);document.getElementById('summary').innerHTML=`<strong>Seçtiklerin</strong>${n?n+' ürün seçildi ❤️':'Henüz ürün seçilmedi'}`}function sendSelection(){const a=Object.values(chosen);if(!a.length){alert('Önce menüden ürün seç 😊');return}if(WHATSAPP_NUMBER==='NUMARANI_BURAYA_YAZ'){alert('Siteyi yayınlayan kişi index.html içindeki WHATSAPP_NUMBER alanına kendi WhatsApp numarasını eklemeli.');return}const lines=a.map(p=>`• ${p.name} × ${p.qty}`).join('\n');const msg=`Merhaba ❤️ Menüden seçtiklerim:\n\n${lines}\n\n`;window.location.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`}
</script></body></html>
