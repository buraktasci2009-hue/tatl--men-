<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sana Özel Menü ♡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#110e14;color:#fff;font-family:system-ui,sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px 14px 120px}.hero{text-align:center;padding:35px 15px;border:1px solid #392d40;border-radius:26px;background:linear-gradient(135deg,#281b30,#17131b)}
.hero h1{font-size:clamp(35px,8vw,58px);margin:10px 0}.hero p{color:#c7bacd}
nav{display:flex;gap:8px;overflow:auto;position:sticky;top:0;padding:14px 0;background:#110e14ee;z-index:2}
nav a{color:#fff;text-decoration:none;background:#211a27;border:1px solid #392d40;border-radius:99px;padding:9px 13px;white-space:nowrap}
section{scroll-margin-top:70px;padding-top:18px}.head{display:flex;justify-content:space-between;align-items:center}.head span{color:#a99cad;font-size:13px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.item{display:flex;align-items:center;gap:12px;padding:14px;background:#1b1720;border:1px solid #392d40;border-radius:16px}
.icon{width:42px;height:42px;display:grid;place-items:center;background:#302238;border-radius:12px;font-size:21px}.name{font-weight:750;flex:1}.pick{background:#2a2030;color:#fff;border:1px solid #57415f;border-radius:11px;padding:9px 11px;font-weight:800}.pick.on{background:linear-gradient(100deg,#a64ddd,#e45fae);border:0}
.qty{display:none;margin-top:7px;align-items:center;gap:7px}.qty.show{display:flex}.qty button{width:27px;height:27px;border:1px solid #57415f;background:#241b2a;color:#fff;border-radius:7px}
.dock{position:fixed;bottom:0;left:0;right:0;background:#151119ee;border-top:1px solid #392d40;padding:11px 14px}.dockin{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.summary{font-size:13px}.summary strong{display:block;font-size:15px}.send{background:linear-gradient(100deg,#a64ddd,#e45fae);border:0;color:#fff;font-weight:900;border-radius:13px;padding:12px 15px}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div style="letter-spacing:3px;color:#e7a7ec;font-size:12px">BİRAZ MUTLULUK SEÇ</div><h1>Sana Özel Menü ♡</h1><p>Canın ne çekiyorsa seç bakalım ✨</p></header>
<nav><a href="#cikolata">🍫 Çikolata</a><a href="#icecek">🥤 İçecek</a><a href="#sakiz">🍬 Sakız</a><a href="#tatli">🍰 Tatlı</a></nav>
<div id="menu"></div>
</main>
<div class="dock"><div class="dockin"><div class="summary" id="summary"><strong>Seçtiklerin</strong>Henüz ürün seçilmedi</div><button class="send" onclick="sendSelection()">Seçtiklerimi Gönder ↗</button></div></div>
<script>
const WHATSAPP_NUMBER="905348560474";
const groups=[
["cikolata","🍫 Çikolata","🍫",["Eti Browni","Ülker Laviva","Ülker Dido","Milka","Kinder Pinguin","Züber Protein Bar"]],
["icecek","🥤 İçecek","🥤",["Fuse Tea Mango","Red Bull","Freşa Meyveli Gazoz","Monster Enerji İçeceği"]],
["sakiz","🍬 Sakız","🍬",["Vivident","First","Oneo"]],
["tatli","🍰 Tatlı","🍰",["Ekler","Soğuk Baklava"]]
];
const chosen={};const menu=document.getElementById("menu");
groups.forEach((g,gi)=>{let s=document.createElement("section");s.id=g[0];s.innerHTML=`<div class="head"><h2>${g[1]}</h2><span>${g[3].length} ürün</span></div><div class="items"></div>`;let box=s.querySelector(".items");
g[3].forEach((name,i)=>{let id=gi+"-"+i,c=document.createElement("div");c.className="item";c.innerHTML=`<div class="icon">${g[2]}</div><div class="name">${name}<div class="qty" id="q${id}"><button onclick="qty('${id}',-1)">−</button><b id="n${id}">1</b><button onclick="qty('${id}',1)">+</button></div></div><button class="pick" id="p${id}" onclick="pick('${id}','${name.replace(/'/g,"\'")}')">Seç</button>`;box.appendChild(c)});menu.appendChild(s)});
function pick(id,name){if(chosen[id])delete chosen[id];else chosen[id]={name,qty:1};let on=!!chosen[id],p=document.getElementById("p"+id);p.classList.toggle("on",on);p.textContent=on?"Seçildi ✓":"Seç";document.getElementById("q"+id).classList.toggle("show",on);update()}
function qty(id,d){if(!chosen[id])return;chosen[id].qty=Math.max(1,chosen[id].qty+d);document.getElementById("n"+id).textContent=chosen[id].qty;update()}
function update(){let a=Object.values(chosen),n=a.reduce((x,y)=>x+y.qty,0);document.getElementById("summary").innerHTML=`<strong>Seçtiklerin</strong>${n?n+" ürün seçildi ❤️":"Henüz ürün seçilmedi"}`}
function sendSelection(){let a=Object.values(chosen);if(!a.length)return alert("Önce menüden ürün seç 😊");let msg="Merhaba ❤️ Menüden seçtiklerim:\n\n"+a.map(x=>`• ${x.name} × ${x.qty}`).join("\n");location.href="https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg)}
</script>
</body>
</html>
